# Example reverse proxy for the Customer WebApp (Next.js standalone on port 3000).
# Not applied automatically. Replace server_name and certificate paths before use.
# Socket.IO is NOT served by this host. The browser calls the API origin directly.

upstream bg_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name app.builtglory.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.builtglory.com;

    # ssl_certificate     /etc/ssl/certs/app.builtglory.com.pem;
    # ssl_certificate_key /etc/ssl/private/app.builtglory.com.key;

    location / {
        proxy_pass http://bg_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
