# Example reverse proxy for Admin Dashboard + API + Socket.IO (same-origin HTTPS).
# Replace upstream hosts, certificate paths, and server_name before use.
# This file is documentation — it is not applied automatically.

upstream bg_api {
    server 127.0.0.1:5001;
    keepalive 32;
}

# HTTP to HTTPS. Apply only after the 443 server blocks have real certificates.
server {
    listen 80;
    server_name admin.builtglory.com api.builtglory.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.builtglory.com;

    # ssl_certificate     /etc/ssl/certs/admin.builtglory.com.pem;
    # ssl_certificate_key /etc/ssl/private/admin.builtglory.com.key;

    root /var/www/bg-admin/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://bg_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (polling + websocket upgrade)
    location /socket.io/ {
        proxy_pass http://bg_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

# Optional dedicated API host (when Dashboard is not same-origin)
server {
    listen 443 ssl http2;
    server_name api.builtglory.com;

    # ssl_certificate     /etc/ssl/certs/api.builtglory.com.pem;
    # ssl_certificate_key /etc/ssl/private/api.builtglory.com.key;

    location / {
        proxy_pass http://bg_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
